# Runs the test suite on every push and pull request, so a broken build is seen before anyone plays it.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test --import ./tests/setup.js
